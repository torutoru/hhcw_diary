# Netlify: frontend 폴더를 빌드해서 배포
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# API 요청은 Render 백엔드로 프록시한다 (같은 도메인이라 로그인 쿠키가 1st-party 로 동작)
[[redirects]]
  from = "/api/*"
  to = "https://hhcw-diary.onrender.com/api/:splat"
  status = 200
  force = true

# PWA: 서비스 워커·manifest·index.html 은 항상 새로 확인해야 새 버전이 바로 퍼진다
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# 빌드 산출물은 파일 이름에 해시가 있어 영구 캐시해도 된다
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA 라우팅
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
