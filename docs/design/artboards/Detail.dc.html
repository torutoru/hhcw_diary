<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>피드 상세보기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#234F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F2EC; color: #1D2620; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 60px; padding: 0 20px; display: flex; align-items: center; font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; font-size: 21px; border-bottom: 1px solid #E4E1D8">우리가족</div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="height: 56px; border-radius: 16px; background: #2F6B4F"></div>
      <div style="height: 520px; border-radius: 20px; background: #FFFFFF"></div>
    </div>
  </div>

  <a href="Feed.dc.html" aria-label="배경을 눌러 상세보기 닫기" style="position: absolute; inset: 0; background: rgba(12, 16, 13, 0.62)"></a>

  <section aria-label="피드 상세" style="position: absolute; left: 12px; right: 12px; top: 36px; bottom: 20px; background: #FFFFFF; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden">
    <div style="padding: 16px 10px 12px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border-bottom: 1px solid #EEEBE3">
      <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 4px">
        <span style="font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; font-size: 20px">2026년 10월 21일 수요일</span>
        <span style="font-size: 13px; color: #5E665F">작성 오전 8:40 · 수정됨 10월 21일 오후 9:12</span>
      </div>
      <a href="Feed.dc.html" aria-label="닫기" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; background: #F4F2EC; display: flex; align-items: center; justify-content: center; color: #1D2620">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 16px 0 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px">
          <sc-for list="{{photos}}" as="p" hint-placeholder-count="6">
            <div style="flex: 0 0 300px; height: 300px; border-radius: 16px; background: {{p.tint}}; scroll-snap-align: center; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #3E4A42">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 9"></path></svg>
              <span style="font-size: 13px">{{p.label}}</span>
              <span style="position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(29, 38, 32, 0.78); color: #FFFFFF">{{p.n}}</span>
            </div>
          </sc-for>
        </div>
        <span style="padding: 0 20px; font-size: 13px; color: #5E665F">옆으로 넘겨서 사진 6장을 볼 수 있어요</span>
      </div>

      <p style="margin: 0; padding: 0 20px; font-size: 16px; line-height: 1.75; white-space: pre-line">한강 공원으로 소풍 다녀온 날.
날씨가 딱 좋아서 돗자리 펴고 김밥 먹고, 막내는 처음으로 보조바퀴 없이 자전거를 탔어요.</p>

      <div style="height: 8px; background: #F4F2EC"></div>

      <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700">댓글 <span style="color: #2F6B4F">{{total}}</span></h2>
        <sc-for list="{{visible}}" as="c" hint-placeholder-count="5">
          <div style="display: flex; gap: 10px">
            <div style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1D2620">{{c.initial}}</div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <div style="display: flex; align-items: baseline; gap: 6px"><b style="font-size: 14px">{{c.who}}</b><span style="font-size: 12px; color: #5E665F">{{c.time}}</span></div>
              <span style="font-size: 15px; line-height: 1.55">{{c.text}}</span>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{hasMore}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{more}}" style="height: 44px; border: 1px solid #D8D4C8; border-radius: 12px; background: #FFFFFF; color: #1D2620; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer">{{moreLabel}}</button>
        </sc-if>

      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: center; padding: 12px 14px 14px; border-top: 1px solid #EEEBE3; background: #FFFFFF">
      <label for="detail-comment" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">댓글 입력</label>
      <input id="detail-comment" type="text" placeholder="따뜻한 한마디 남기기" value="{{draft}}" onChange="{{onDraft}}" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1px solid #D8D4C8; border-radius: 999px; padding: 0 18px; font-size: 15px; background: #F9F8F4; color: #1D2620; font-family: inherit">
      <button type="button" onClick="{{send}}" aria-label="댓글 등록" style="width: 48px; height: 48px; flex: 0 0 48px; border: 0; border-radius: 50%; background: #2F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      shown: 5,
      draft: '',
      comments: [
        { who: '할머니', time: '오후 1:02', text: '김밥 싸들고 간 보람이 있네~' },
        { who: '큰딸', time: '오후 1:15', text: '다음엔 나도 자전거 탈래!' },
        { who: '아빠', time: '오후 2:30', text: '막내 자전거 타는 영상도 올려줘' },
        { who: '할아버지', time: '오후 3:04', text: '날씨 좋았구나. 다들 잘 다녀왔네' },
        { who: '막내', time: '오후 4:21', text: '나 혼자 탔어!!!' },
        { who: '이모', time: '오후 5:10', text: '사진 너무 예쁘다~' },
        { who: '엄마', time: '오후 6:02', text: '이모도 다음엔 같이 가요' },
        { who: '큰딸', time: '오후 6:40', text: '세 번째 사진 내 프사 할래' },
        { who: '할머니', time: '오후 7:12', text: '감기 조심하고' },
        { who: '아빠', time: '오후 8:00', text: '돗자리 새로 사야겠다' },
        { who: '막내', time: '오후 8:31', text: '내일도 가자' },
        { who: '엄마', time: '오후 9:12', text: '사진 두 장 더 추가했어요' }
      ]
    };
  }
  renderVals() {
    const colors = { '할머니': '#F2D9A6', '할아버지': '#D9E4F2', '아빠': '#CFE3D6', '엄마': '#F4D3C4', '큰딸': '#E3DCF2', '막내': '#F7E7A9', '이모': '#E6E1D6' };
    const tints = ['#DCE8DF', '#F3E3C3', '#E3E0EE', '#F2DCD3', '#DDE6EF', '#EAE7DC'];
    const all = this.state.comments;
    const visible = all.slice(0, this.state.shown).map((c) => ({ ...c, initial: c.who.slice(0, 1), bg: colors[c.who] || '#E6E1D6' }));
    const left = all.length - this.state.shown;
    return {
      photos: tints.map((t, i) => ({ tint: t, n: (i + 1) + ' / 6', label: i === 0 ? '[대표 사진]' : '[사진 ' + (i + 1) + ']' })),
      total: all.length,
      visible,
      hasMore: left > 0,
      moreLabel: '댓글 더보기 (' + Math.min(5, left) + '개 / 남은 ' + left + '개)',
      more: () => this.setState({ shown: this.state.shown + 5 }),
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        const t = (this.state.draft || '').trim();
        if (!t) return;
        const next = this.state.comments.concat([{ who: '엄마', time: '방금', text: t }]);
        this.setState({ comments: next, draft: '', shown: next.length });
      }
    };
  }
}
</script>
</body>
</html>
