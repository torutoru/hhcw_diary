<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입 요청 메일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#234F3B}
</style>
</helmet>
<div style="width: 600px; height: 760px; box-sizing: border-box; background: #ECE9E1; color: #1D2620; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 32px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4F574F">
    <span><b style="color: #1D2620">보낸 사람</b> 우리가족 &lt;no-reply@[도메인]&gt;</span>
    <span><b style="color: #1D2620">받는 사람</b> [관리자 이메일]</span>
    <span><b style="color: #1D2620">제목</b> [우리가족] 회원가입 요청이 들어왔어요</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 36px 40px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 11px; background: #2F6B4F; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>
      </div>
      <span style="font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; font-size: 20px">우리가족</span>
    </div>

    <h1 style="margin: 0; font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; font-size: 28px; font-weight: 400">새 가족이 가입을 요청했어요</h1>

    <div style="display: grid; grid-template-columns: 110px 1fr; row-gap: 12px; font-size: 15px; padding: 18px 20px; background: #F4F2EC; border-radius: 14px">
      <span style="color: #4F574F">요청 이메일</span><span style="font-weight: 700">[요청자 이메일]</span>
      <span style="color: #4F574F">요청 시각</span><span>2026-10-21 20:14</span>
      <span style="color: #4F574F">링크 만료</span><span>2026-10-21 21:14 (1시간 후)</span>
    </div>

    <a href="Confirm.dc.html" style="height: 56px; border-radius: 14px; background: #2F6B4F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">가입 승인하기</a>

    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.6; color: #4F574F">
      <span>버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여 넣어 주세요.</span>
      <code style="font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; padding: 10px 12px; border-radius: 10px; background: #F4F2EC; color: #1D2620; word-break: break-all">https://[도메인]/api/signup/confirm/[uuid]</code>
      <span>이 링크는 발급 후 1시간 동안, 한 번만 쓸 수 있어요. 모르는 요청이면 이 메일을 무시하세요.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
