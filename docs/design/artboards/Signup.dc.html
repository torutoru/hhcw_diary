<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>우리가족 회원가입</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#234F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F2EC; color: #1D2620; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column">
  <div style="height: 60px; padding: 0 8px; display: flex; align-items: center">
    <a href="Main.dc.html" aria-label="로그인으로 돌아가기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D2620; border-radius: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </div>

  <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 28px; flex: 1">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; font-size: 28px; font-weight: 400">가족 가입 요청</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5E665F">요청을 보내면 관리자가 메일로 승인해요.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="su-email" style="font-size: 14px; font-weight: 500">이메일</label>
          <input id="su-email" type="email" placeholder="family@example.com" style="height: 52px; box-sizing: border-box; border: 1px solid #D8D4C8; border-radius: 14px; padding: 0 16px; font-size: 16px; background: #FFFFFF; color: #1D2620; font-family: inherit">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="su-pw" style="font-size: 14px; font-weight: 500">비밀번호</label>
          <input id="su-pw" type="password" placeholder="4자 이상" style="height: 52px; box-sizing: border-box; border: 1px solid #D8D4C8; border-radius: 14px; padding: 0 16px; font-size: 16px; background: #FFFFFF; color: #1D2620; font-family: inherit">
          <span style="font-size: 13px; color: #5E665F">4자 이상이면 돼요.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="su-pw2" style="font-size: 14px; font-weight: 500">비밀번호 확인</label>
          <input id="su-pw2" type="password" placeholder="한 번 더 입력" style="height: 52px; box-sizing: border-box; border: 1.5px solid #B3412A; border-radius: 14px; padding: 0 16px; font-size: 16px; background: #FFFFFF; color: #1D2620; font-family: inherit">
          <span style="font-size: 13px; color: #A3361F">비밀번호가 서로 달라요.</span>
        </div>
      </div>

      <button type="button" onClick="{{submit}}" style="margin-top: auto; height: 54px; border: 0; border-radius: 14px; background: #2F6B4F; color: #FFFFFF; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer">가입 요청 보내기</button>
    </div>
  </sc-if>

  <sc-if value="{{showDone}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 80px 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1; text-align: center">
      <div style="width: 84px; height: 84px; border-radius: 50%; background: #E3EEE6; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
      </div>
      <h1 style="margin: 0; font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; font-size: 26px; font-weight: 400">가입 요청을 보냈어요</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #5E665F">관리자에게 승인 메일이 전송됐어요.<br>승인 링크는 1시간 동안만 유효해요.<br>승인되면 이 이메일로 로그인할 수 있어요.</p>
      <a href="Main.dc.html" style="margin-top: auto; width: 100%; height: 54px; border-radius: 14px; background: #2F6B4F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">로그인 화면으로</a>
      <button type="button" onClick="{{reset}}" style="height: 44px; border: 0; background: transparent; color: #2F6B4F; font-size: 15px; font-family: inherit; cursor: pointer">다시 입력하기</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: false };
  }
  renderVals() {
    return {
      showForm: !this.state.done,
      showDone: this.state.done,
      submit: () => this.setState({ done: true }),
      reset: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
