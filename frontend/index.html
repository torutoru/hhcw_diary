<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 화면 확대는 막고(사진 크게 보기에서만 확대), 아이폰에서 입력칸을 누를 때 저절로 확대되는 것도 막는다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F4F2EC" />
    <meta name="description" content="하루 한 장, 우리 집 이야기" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <!-- PWA: manifest 는 빌드 시 vite-plugin-pwa 가 자동으로 연결한다 -->
    <!-- 아이폰 홈 화면 설치용 (iOS 사파리는 manifest 아이콘 대신 이 값을 쓴다) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 앱 이름 자리표시는 빌드할 때 서비스 이름(VITE_APP_NAME, 기본 "우리가족")으로 바뀐다 (vite.config.ts) -->
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <title>__APP_NAME__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
